<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Wereld - Jeux éducatifs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="../">Accueil</a>
            <a href="../vocab/">Vocabulaire</a>
            <a href="../hetweer/">Het Weer</a>
            <a href="#" class="active">De Wereld - Deel 1</a>
            <a href="deel2.html">De Wereld - Deel 2</a>
        </nav>

        <header>
            <h1>🌍 De Wereld</h1>
            <p>Paysages, lieux et géographie en néerlandais.</p>
        </header>

        <div class="modes">
            <button type="button" class="mode-btn active" data-mode="nlToFr">Néerlandais → Français</button>
            <button type="button" class="mode-btn" data-mode="frToNl">Français → Néerlandais</button>
            <button type="button" class="mode-btn" data-mode="emojiToNl">Image → Néerlandais</button>
        </div>

        <section class="stats">
            <div class="stat-card">
                <span>Score</span>
                <strong id="score">0/0</strong>
            </div>
            <div class="stat-card">
                <span>Série</span>
                <strong id="streak">0</strong>
            </div>
            <div class="stat-card">
                <span>Restant</span>
                <strong id="remaining">0</strong>
            </div>
        </section>

        <main class="quiz-card">
            <div id="emoji" class="emoji"></div>
            <p id="label" class="label"></p>
            <h2 id="question">Chargement...</h2>

            <div id="options" class="options"></div>

            <p id="feedback" class="feedback"></p>

            <div class="actions">
                <button id="nextBtn" disabled>Question suivante</button>
                <button id="restartBtn" class="secondary">Recommencer</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
